# GE_Runtime 启动配置（发行版播放器）
#
# 查找顺序：exe 同级 → 当前工作目录；都不存在则全部走引擎默认值。
# 发行版里这份文件由 gepack 写到输出目录，与 GE_Runtime.exe 同级。
# 命令行覆盖（优先级最高）：--scene <路径> / --fullscreen / --free-camera

# 入口场景：相对资源根（assets/），规范形——正斜杠、不带 assets/ 前缀、不带盘符
scene: scenes/2.scene

window:
  title: "GE Runtime"
  width: 1600
  height: 900
  vsync: false
  fullscreen: false

# 渲染开关：省略某个键 = 不覆盖引擎默认值（只写你要改的项）
# 天空盒 / IBL 环境不在这里配置——它由场景内的 EnvironmentComponent 决定
#rendering:
#  deferred: true      # 延迟渲染（GBuffer 链）
#  tonemap: true       # 曝光 + ACES
#  bloom: true         # 泛光
#  culling: mesh       # 视锥剔除粒度：mesh | submesh
