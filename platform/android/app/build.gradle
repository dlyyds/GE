// GE_Runtime 的 Android 应用模块。
//
// 骨架取自 SDL 自带的 android-project（含 gradle wrapper 与 org.libsdl.app 的 Java 源），
// 改动集中在：版本号对齐本机工具链、最小 API 提到 Vulkan 1.3 所需的 33、
// 原生构建指向引擎**仓库根**的 CMakeLists（而非 SDL 模板的 jni/ 示例）。

plugins {
    id 'com.android.application'
}

android {
    // 与 src/main/java/org/libsdl/app 的包名一致。SDLActivity 与 R 类都依赖它，
    // 改成别的值需要同步改 Java 包名与 manifest 的 activity 名。
    namespace = "org.libsdl.app"

    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    ndkVersion = "27.3.13750724"

    defaultConfig {
        applicationId "com.ge.runtime"

        // minSdk 33 不是随便定的：引擎对 Vulkan 1.3 是硬要求（apiVersion >= 1.3
        // 且把 dynamicRendering / synchronization2 当核心 1.3 特性启用，无扩展回退），
        // 而 Vulkan 1.3 的设备覆盖基本从 Android 13 起。详见 Android移植计划书 §4.4。
        // ⚠️ 此值待真机 vulkaninfo 核实后可能调整。
        minSdkVersion 33
        targetSdkVersion 36

        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // c++_static：单个 .so，无需往 APK 里塞 libc++_shared.so。
                // ANDROID_PLATFORM 与上面的 minSdkVersion 保持一致。
                arguments "-DANDROID_PLATFORM=android-33", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    // 指向**引擎仓库根**的 CMakeLists，而不是 SDL 模板里的 jni/CMakeLists.txt。
    // 这一点是刻意的：引擎 CMakeLists 里有 70+ 处 ${CMAKE_SOURCE_DIR}，
    // 只有让仓库根当顶层源目录它们才解析正确 —— 所以不能再套一层
    // add_subdirectory，只能直接把 Gradle 的 CMake 入口钉在仓库根。
    // 仓库根内部按 if(ANDROID) 分区，跳过桌面专用目标。
    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
        }
    }

    // 已经在 APK 里压过一遍的格式不再二次压缩：省体积，也让将来做"流式读取"
    // （AAsset_seek 只对未压缩资产有效）不必回头改这里。
    androidResources {
        noCompress.addAll(['ktx', 'ktx2', 'png', 'jpg', 'jpeg', 'wav',
                           'gemesh', 'geanim', 'spv', 'ttf'])
    }
}

// ============================================================
// gepack 资产入包
// ============================================================
// 引擎在 Android 上只能从 APK 内的 assets/ 读资产（经 AAssetManager，见 VFS）。
// 这里把主机侧 `bin/gepack.exe` 产出的 dist/ 树接进 AGP 的资产合并流程。
//
// 拷到 build/ 下的**生成目录**而不是 src/main/assets：
//   - 不污染源码树（216MB 的资产不该出现在 git status 里）
//   - dist/ 本身已在 .gitignore 中（可重新生成）
def gepackDistDir = file('../../../dist')
def generatedAssetsDir = layout.buildDirectory.dir('generated/gepackAssets')

tasks.register('copyGameAssets', Copy) {
    description = '把 gepack 的 dist/ 接成 APK 的 assets/（assets/** + game.cfg）'
    group = 'ge'

    doFirst {
        if (!new File(gepackDistDir, 'assets').isDirectory()) {
            throw new GradleException(
                """找不到 ${gepackDistDir}/assets —— 先产出发行包再构建 APK：
                     bin/gepack.exe --scene assets/scenes/2.scene --out dist
                   注意仓库不含 models/materal/audio/environments/HDRI 等大资产
                   （.gitignore 已排除），需本机备齐后 gepack 才能收全。""".stripIndent())
        }
        if (!new File(gepackDistDir, 'game.cfg').isFile()) {
            logger.warn("WARNING: ${gepackDistDir}/game.cfg 不存在，APK 里将没有发行配置，" +
                        "运行时回退内置默认值（场景为 scenes/2.scene）")
        }
    }

    // dist/assets/** → APK 的 assets/**（生成目录下的 assets/ 子目录即 APK 的 assets/）
    from(new File(gepackDistDir, 'assets')) { into 'assets' }
    // dist/game.cfg → APK assets 根（GameConfig 在 Android 上回退到这里读）
    from(new File(gepackDistDir, 'game.cfg'))
    into generatedAssetsDir
}

android {
    sourceSets.main.assets.srcDir(generatedAssetsDir.get().asFile)

    // 原生构建要先于资源合并完成；资产生成同样要在合并前完成。
    applicationVariants.all { variant ->
        def cap = variant.name.capitalize()
        tasks["merge${cap}Assets"].dependsOn("externalNativeBuild${cap}")
        tasks["merge${cap}Assets"].dependsOn("copyGameAssets")
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
